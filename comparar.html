<!-- Contenedor centrado -->
<div style="text-align: center; margin-top: 30px;">
  <!-- Botón Calcular -->
  <button id="calcularComparacion">Calcular</button>

  <!-- Botón Volver -->
  <div style="margin-top: 20px;">
    <a href="simulador.html">
      <button>Volver al Simulador</button>
    </a>
  </div>

  <!-- Resultado centrado también -->
  <div id="resultadoComparacion" style="margin-top: 20px;"></div>
</div>


<script>
 document.getElementById("calcularComparacion").addEventListener("click", () => {
  // Recuperar el ingreso total de sessionStorage
  const ingresoTotal = parseInt(sessionStorage.getItem("ingresoTotal")) || 0;

  // Obtener todos los campos de gastos
  const valoresGastos = document.querySelectorAll(".valor-gasto");
  let totalGastos = 0;

  // Sumar los valores de los campos de gastos
  valoresGastos.forEach(input => {
    totalGastos += parseInt(input.value) || 0;
  });

  // Obtener todos los campos de ingresos
  const valoresIngresos = document.querySelectorAll(".valor-ingreso");
  let totalIngresos = 0;

  // Sumar los valores de los campos de ingresos
  valoresIngresos.forEach(input => {
    totalIngresos += parseInt(input.value) || 0;
  });

  // Sumar el ingreso total con los valores de los ingresos
  const ingresoFinal = ingresoTotal + totalIngresos;

  // Calcular la ganancia
  const ganancia = ingresoFinal - totalGastos;

  // Crear la tabla con los resultados
  const resultadoHTML = `
    <table border="1" cellpadding="5" cellspacing="0">
      <thead>
        <tr><th>Concepto</th><th>Valor</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>Ingreso de Boletas</strong></td><td>${ingresoTotal.toLocaleString()}</td></tr>
        <tr><td><strong>Ingreso Adicional</strong></td><td>${totalIngresos.toLocaleString()}</td></tr>
        <tr><td><strong>Ingreso Final</strong></td><td>${ingresoFinal.toLocaleString()}</td></tr>
        <tr><td><strong>Egresos</strong></td><td>${totalGastos.toLocaleString()}</td></tr>
        <tr>
          <td><strong>${ganancia >= 0 ? "Valor Total" : "Valor Total"}</strong></td>
          <td><strong style="color: ${ganancia >= 0 ? "green" : "red"}">${ganancia.toLocaleString()}</strong></td>
        </tr>
      </tbody>
    </table>
  `;

  // Mostrar los resultados en la página
  document.getElementById("resultadoComparacion").innerHTML = resultadoHTML;
});

window.addEventListener("DOMContentLoaded", () => {
  // Recuperar el ingreso total de sessionStorage y mostrarlo al cargar la página
  const ingresoTotal = parseInt(sessionStorage.getItem("ingresoTotal")) || 0;
  const ingresoAuto = document.createElement("p");
  ingresoAuto.innerHTML = `<strong>Ingreso de Boletas Recibido:</strong> ${ingresoTotal.toLocaleString()}`;
  document.querySelector(".container").insertBefore(ingresoAuto, document.getElementById("resultadoComparacion"));
});


  </script>
